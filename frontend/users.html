<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users | AMBS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <main class="page">
    <nav class="top-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="users.html">User management</a>
      <a href="enrollment.html">Enrolment</a>
      <a href="authentication.html">Authentication</a>
      <a href="audit.html">Audit logs</a>
      <a href="monitoring.html">Event monitoring</a>
      <a href="settings.html">System configuration</a>
    </nav>
    <h1>Users</h1>
    <div class="grid-2">
      <section class="card">
        <h2>Create user</h2>
        <form id="create-user-form">
          <label for="user-username">Username</label>
          <input id="user-username" name="username" required>
          <label for="user-password">Password</label>
          <input id="user-password" name="password" type="password" required>
          <label for="user-full-name">Full name</label>
          <input id="user-full-name" name="fullName" required>
          <label for="user-email">Email</label>
          <input id="user-email" name="email" type="email">
          <label for="user-role">Role</label>
          <select id="user-role" name="role">
            <option value="operator">Operator</option>
            <option value="administrator">Administrator</option>
            <option value="auditor">Auditor</option>
            <option value="security_officer">Security officer</option>
          </select>
          <button type="submit">Create user</button>
        </form>
      </section>
      <section class="card">
        <h2>User list</h2>
        <button id="load-users" type="button">Refresh users</button>
        <div id="users-table"></div>
      </section>
    </div>
  </main>
  <script src="../javascript/app.js"></script>
</body>

</html>
